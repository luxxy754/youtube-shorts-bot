name: AI Video Generator Bot

# Actions kab run hongi
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # GitHub Actions tab se manually run karne ke liye
  workflow_dispatch: 

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Repository Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. System level FFmpeg Install (MoviePy/Audio merge ke liye zaroori hai)
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 3. Python Setup
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. Requirements/Dependencies Install
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. Main Python Script Run karna (Secrets pass karke)
    - name: Run Video Generator Script
      env:
        REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python main.py

    # 6. Final Video File ko GitHub Artifacts me Upload karna
    - name: Upload Generated Video
      uses: actions/upload-artifact@v4
      with:
        name: generated-short-video
        path: generated_short.mp4
        if-no-files-found: warn
