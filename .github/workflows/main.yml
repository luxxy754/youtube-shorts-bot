name: Automated YouTube Shorts Bot

on:
  schedule:
    # Har roz UTC time ke mutabiq chalega (e.g., 2:00 PM UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Manual run button ke liye

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          pip install google-genai requests "moviepy==1.0.3" gTTS google-api-python-client google-auth-oauthlib pillow

      - name: Run Automation Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}
        run: python main.py
