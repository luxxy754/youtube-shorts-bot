name: AI Shorts Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only make the video, do not upload to YouTube"
        type: boolean
        default: false
  # Auto-run 2 times daily (UTC time)
  # 04:00 UTC = 09:00 AM PKT | 14:00 UTC = 07:00 PM PKT
  schedule:
    - cron: "0 4,14 * * *"

permissions:
  contents: read

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and upload Short
        timeout-minutes: 25
        env:
          # ---- Agnes AI keys (free, no card, multi-account rotation) ----
          AGNES_API_KEY_1: ${{ secrets.AGNES_API_KEY_1 }}
          AGNES_API_KEY_2: ${{ secrets.AGNES_API_KEY_2 }}
          AGNES_API_KEY_3: ${{ secrets.AGNES_API_KEY_3 }}
          AGNES_MODEL: "agnes-video-2.5-flash"

          # ---- Story generation ----
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # ---- Audio (ElevenLabs keys rotate) ----
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}

          # ---- YouTube upload ----
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'public' }}

          DRY_RUN: ${{ inputs.dry_run }}

          # Story / clip settings
          NUM_SCENES: "3"
          CLIP_SECONDS: "5"
          MUSIC_VOLUME: "0.16"
        run: python main.py

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/final_short.mp4
            output/meta.json
          if-no-files-found: warn
