name: Generate AI Short

on:
  workflow_dispatch: {}   # Manual "Run workflow" button se chalega
  schedule:
    - cron: "0 3 * * *"    # ~8:30 AM PKT - short #1
    - cron: "0 13 * * *"   # ~6:30 PM PKT - short #2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}
          PIXVERSE_KEY_1: ${{ secrets.PIXVERSE_KEY_1 }}
          PIXVERSE_KEY_2: ${{ secrets.PIXVERSE_KEY_2 }}
          PIXVERSE_KEY_3: ${{ secrets.PIXVERSE_KEY_3 }}
          PIXVERSE_KEY_4: ${{ secrets.PIXVERSE_KEY_4 }}
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          # Free tier: add HF_TOKEN_2 / HF_TOKEN_3 / HF_TOKEN_4 secrets too
          # (tokens from separate free Hugging Face accounts) to stretch
          # the daily free ZeroGPU quota further, same idea as your
          # PIXVERSE_KEY_1..4 rotation.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          HF_TOKEN_3: ${{ secrets.HF_TOKEN_3 }}
          HF_TOKEN_4: ${{ secrets.HF_TOKEN_4 }}
          # Optional: comma-separated list of HF Spaces to try, e.g.
          # "Wan-AI/Wan2.1,someuser/some-other-free-video-space"
          # HF_VIDEO_SPACES: ${{ secrets.HF_VIDEO_SPACES }}
          NUM_SCENES: "5"
          # Optional (free): auto-upload to YouTube. See
          # get_youtube_refresh_token.py for one-time setup. Leave these
          # three unset to just get the video as a downloadable artifact
          # instead, with no upload attempted.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # "private" by default so you can review quality first; change
          # to "public" (as a repo Variable or secret) once you're happy.
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'private' }}
        run: python main.py

      - name: Upload final video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-short-${{ github.run_id }}
          path: final_short.mp4
          if-no-files-found: warn
