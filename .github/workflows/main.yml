name: Cat Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the video, do not upload"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: cat-shorts
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Debug - verify main.py structure
        run: |
          tail -15 main.py
          python -c "import main; print('main.py imports OK')"

      - name: Generate and upload Short
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_API_KEY_2: ${{ secrets.AGNES_API_KEY_2 }}
          AGNES_API_KEY_3: ${{ secrets.AGNES_API_KEY_3 }}
          AGNES_MODEL: "agnes-video-2.5"

          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}

          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'public' }}

          DRY_RUN: ${{ inputs.dry_run }}

          NUM_SCENES: "1"
          NUM_CLIPS: "3"
          CLIP_SECONDS: "5"
          MUSIC_VOLUME: "0.16"
          AGNES_POLL_TIMEOUT: "600"
          AGNES_POLL_INTERVAL: "3"
        run: python -u main.py

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/final_short.mp4
            output/meta.json
          if-no-files-found: warn
