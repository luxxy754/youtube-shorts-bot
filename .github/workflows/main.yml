name: Pet Drama Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the video, do not upload"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: pet-drama
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate and upload Short
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}

          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'public' }}

          DRY_RUN: ${{ inputs.dry_run }}

          NUM_SCENES: "4"
          CLIP_SECONDS: "4"
          MUSIC_VOLUME: "0.16"

          TTS_LANG: "hi"
          TTS_GENDER: "female"
          TTS_RATE: "-5%"
          TTS_PITCH: "+2Hz"

          IMAGE_MODEL: "flux"
        run: python -u main.py

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/final_short.mp4
            output/meta.json
          if-no-files-found: warn
