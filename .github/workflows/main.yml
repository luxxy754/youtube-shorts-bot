name: Generate AI Short

on:
  workflow_dispatch: {}   # Manual "Run workflow" button se chalega
  # schedule:
  #   - cron: "0 6 * * *"  # chaho to daily auto-run ke liye uncomment karo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}
        run: python main.py

      - name: Upload final video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-short
          path: final_short.mp4
          if-no-files-found: warn
