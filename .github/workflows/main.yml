name: Automated PixVerse Video Shorts Bot

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXVERSE_API_KEY_1: ${{ secrets.PIXVERSE_API_KEY_1 }}
          PIXVERSE_API_KEY_2: ${{ secrets.PIXVERSE_API_KEY_2 }}
          PIXVERSE_API_KEY_3: ${{ secrets.PIXVERSE_API_KEY_3 }}
          PIXVERSE_API_KEY_4: ${{ secrets.PIXVERSE_API_KEY_4 }}
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
        run: |
          python main.py

      - name: Upload Generated Video as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-short-video
          path: final_short.mp4
