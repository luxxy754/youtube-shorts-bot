name: Python Video Generator Bot Workflow

# 1. Workflow kab chalega (Triggers)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manual Run button ke liye (Actions tab se trigger karne ke liye)
  workflow_dispatch: 

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Code checkout karne ke liye
    - name: Checkout Repository
      uses: actions/checkout@v4

    # System me FFmpeg install karne ke liye (Video/Audio processing ke liye zaroori hai)
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # Python setup karne ke liye
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Dependencies install karne ke liye
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Secrets/API Keys secure tareeqe se pass karke script run karein
    - name: Run Script
      env:
        REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python main.py
