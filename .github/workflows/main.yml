name: AI Video Generation Workflow

on:
  workflow_dispatch:
  schedule:
    # Rozana 2 dafa run hoga (Trending timings: 12:30 PM aur 6:30 PM PKT)
    - cron: '30 7 * * *'   
    - cron: '30 13 * * *'  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-auth google-auth-oauthlib google-api-python-client gradio-client

    - name: Run Python Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
        HF_TOKEN_3: ${{ secrets.HF_TOKEN_3 }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: |
        python main.py
