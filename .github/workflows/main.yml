name: Automated AI Content Generator Pipeline

on:
  schedule:
    # Daily automated trigger at UTC 00:00 (Subah 5:00 AM PKT)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      content_category:
        description: 'Select Content Type'
        required: true
        default: 'ai_vs_human'
        type: choice
        options:
          - ai_vs_human
          - day_in_life_ai
          - quick_ai_hacks

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine Content Category
        id: select-category
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "CATEGORY=${{ github.event.inputs.content_category }}" >> $GITHUB_OUTPUT
          else
            # Automated Rotation based on Day of Week
            DAY=$(date +%u)
            if [ "$DAY" -eq 1 ] || [ "$DAY" -eq 4 ]; then
              echo "CATEGORY=ai_vs_human" >> $GITHUB_OUTPUT
            elif [ "$DAY" -eq 2 ] || [ "$DAY" -eq 5 ]; then
              echo "CATEGORY=day_in_life_ai" >> $GITHUB_OUTPUT
            else
              echo "CATEGORY=quick_ai_hacks" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate AI Content Script & Prompt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELECTED_CATEGORY: ${{ steps.select-category.outputs.CATEGORY }}
        run: |
          python scripts/generate_script.py --type $SELECTED_CATEGORY

      - name: Synthesize Voiceover & Generate Assets
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/create_assets.py

      - name: Render Video (FFmpeg / MoviePy)
        run: |
          python scripts/render_video.py --output output/short_video.mp4

      - name: Upload Video to YouTube Shorts
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py --file output/short_video.mp4
