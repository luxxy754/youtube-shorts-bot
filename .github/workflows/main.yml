name: Talking Veggies Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the video, do not upload"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"    # 02:00 UTC
    - cron: "0 14 * * *"   # 14:00 UTC

permissions:
  contents: read

concurrency:
  group: talking-veggies
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget

      - name: Install Python deps
        run: |
          pip install -r requirements.txt

      - name: Cache Wav2Lip repo
        uses: actions/cache@v4
        with:
          path: Wav2Lip
          key: wav2lip-repo-v3

      - name: Cache Wav2Lip model
        uses: actions/cache@v4
        with:
          path: Wav2Lip/checkpoints
          key: wav2lip-gan-v3

      - name: Clone Wav2Lip
        run: |
          if [ ! -d "Wav2Lip" ]; then
            git clone https://github.com/Rudrabha/Wav2Lip.git
          fi

      - name: Download Wav2Lip checkpoint
        run: |
          mkdir -p Wav2Lip/checkpoints
          if [ ! -s Wav2Lip/checkpoints/wav2lip_gan.pth ]; then
            wget -q --show-progress -O Wav2Lip/checkpoints/wav2lip_gan.pth \
              "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth"
          fi
          ls -lh Wav2Lip/checkpoints/

      - name: Download face detection model
        run: |
          mkdir -p Wav2Lip/face_detection/detection/sfd
          if [ ! -s Wav2Lip/face_detection/detection/sfd/s3fd.pth ]; then
            wget -q --show-progress -O Wav2Lip/face_detection/detection/sfd/s3fd.pth \
              "https://huggingface.co/camenduru/Wav2Lip/resolve/main/face_detection/detection/sfd/s3fd.pth"
          fi
          ls -lh Wav2Lip/face_detection/detection/sfd/

      - name: Install Wav2Lip deps
        run: |
          pip install "numpy<2.0" "numba>=0.58,<0.60" \
                      librosa==0.10.2 opencv-python-headless tqdm

      - name: Generate and upload Short
        timeout-minutes: 100
        env:
          # ---- Story generation ----
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # ---- edge-tts settings (no API key!) ----
          TTS_LANG: "hi"          # "hi" for Hindi, "ur" for Urdu
          TTS_GENDER: "female"    # "female" or "male"
          TTS_RATE: "-8%"         # slower for kids
          TTS_PITCH: "+2Hz"

          # ---- ElevenLabs keys (optional - only for SFX/music) ----
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}

          # ---- YouTube upload ----
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'public' }}

          DRY_RUN: ${{ inputs.dry_run }}

          NUM_SCENES: "4"
          MUSIC_VOLUME: "0.16"

          IMAGE_MODEL: "flux"
          IMAGE_TIMEOUT: "240"
          IMAGE_RETRIES: "4"

          WAV2LIP_CHECKPOINT: ${{ github.workspace }}/Wav2Lip/checkpoints/wav2lip_gan.pth
        run: python main.py

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/final_short.mp4
            output/meta.json
          if-no-files-found: warn
