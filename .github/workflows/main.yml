name: AI Shorts Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only make the video, do not upload to YouTube"
        type: boolean
        default: false
  # Auto-run 2 times daily (UTC time)
  # 04:00 UTC = 09:00 AM PKT | 14:00 UTC = 07:00 PM PKT
  schedule:
    - cron: "0 4,14 * * *"

permissions:
  contents: read

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and upload Short
        env:
          # ---- fal.ai (free 5/day per signed-in account) ----
          # Get keys at https://fal.ai -> sign in -> API Keys
          FAL_KEY_1: ${{ secrets.FAL_KEY_1 }}
          FAL_KEY_2: ${{ secrets.FAL_KEY_2 }}

          # ---- Agnes AI fallback (free) ----
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_MODEL: "agnes-video-2.5-flash"

          # ---- Story generation ----
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # ---- HuggingFace fallback tokens ----
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          HF_TOKEN_3: ${{ secrets.HF_TOKEN_3 }}

          # ---- Image fallback ----
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}

          # ---- Audio (ElevenLabs keys rotate) ----
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}

          # ---- YouTube upload ----
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'public' }}

          # Scheduled runs have no inputs, so this is empty and the video gets uploaded.
          # Manual runs with dry_run ticked pass "true" and skip the upload.
          DRY_RUN: ${{ inputs.dry_run }}

          # 0 = Replicate paid (best quality, needs card)
          # 1 = free mode: fal.ai -> Agnes -> HuggingFace -> image+zoom
          FREE_MODE: "1"

          # Real video models (only used if FREE_MODE=0)
          VIDEO_MODELS: "bytedance/seedance-1-lite,minimax/video-01"

          # Story / clip settings
          NUM_SCENES: "3"
          CLIP_SECONDS: "5"
          MUSIC_VOLUME: "0.16"
        run: python main.py

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/final_short.mp4
            output/meta.json
          if-no-files-found: warns
