name: AI Shorts Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only make the video, do not upload to YouTube"
        type: boolean
        default: false
  # 4 runs daily, 6 hours apart. Each run produces ONE Short.
  # 2 shorts/day requirement => 2 of these will actually upload a video,
  # the other 2 act as retries if a previous run failed.
  schedule:
    - cron: "0 2 * * *"    # 02:00 UTC (07:00 AM PKT)
    - cron: "0 8 * * *"    # 08:00 UTC (01:00 PM PKT)
    - cron: "0 14 * * *"   # 14:00 UTC (07:00 PM PKT)
    - cron: "0 20 * * *"   # 20:00 UTC (01:00 AM PKT)

permissions:
  contents: read

concurrency:
  group: ai-shorts-bot
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and upload Short
        timeout-minutes: 20
        env:
          # ---- Story generation ----
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # ---- Audio (ElevenLabs keys rotate) ----
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}

          # ---- YouTube upload ----
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'public' }}

          DRY_RUN: ${{ inputs.dry_run }}

          # ---- Story / scene settings ----
          NUM_SCENES: "4"
          CLIP_SECONDS: "5"
          MUSIC_VOLUME: "0.16"

          # ---- Image generation ----
          IMAGE_MODEL: "flux"
          IMAGE_TIMEOUT: "180"
          IMAGE_RETRIES: "3"
        run: python main.py

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/final_short.mp4
            output/meta.json
          if-no-files-found: warn
