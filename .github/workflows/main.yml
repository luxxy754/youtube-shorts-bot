name: Cat Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the video, do not upload"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: cat-shorts
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate and upload Short
        timeout-minutes: 35
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # Magic Hour - 4 accounts
          VIDEO_KEY_1: ${{ secrets.VIDEO_KEY_1 }}
          VIDEO_KEY_2: ${{ secrets.VIDEO_KEY_2 }}
          VIDEO_KEY_3: ${{ secrets.VIDEO_KEY_3 }}
          VIDEO_KEY_4: ${{ secrets.VIDEO_KEY_4 }}

          # Cat sounds + music
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          ELEVEN_KEY_2: ${{ secrets.ELEVEN_KEY_2 }}
          ELEVEN_KEY_3: ${{ secrets.ELEVEN_KEY_3 }}

          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'public' }}

          DRY_RUN: ${{ inputs.dry_run }}

          NUM_SCENES: "1"
          MUSIC_VOLUME: "0.16"
          MAGIC_HOUR_MODEL: "wan-2.2"
          VIDEO_RESOLUTION: "480p"
          MAGIC_HOUR_POLL_TIMEOUT: "600"
        run: python main.py

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/final_short.mp4
            output/meta.json
          if-no-files-found: warn
