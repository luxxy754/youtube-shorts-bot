name: Daily Auto YouTube Shorts Bot

on:
  schedule:
    # Runs twice a day at peak hours (UTC time adjusted for kids peak time: 10:00 UTC & 14:00 UTC)
    - cron: '0 10,14 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install requests google-genai gtts

      - name: Run YouTube Shorts Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVEN_KEY_1: ${{ secrets.ELEVEN_KEY_1 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: "public" # Automatically public upload
          NUM_SCENES: "5"
        run: |
          python main.py
